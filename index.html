<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Gustando · Piano di lancio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800;900&display=swap">
<style>
:root{--bg:#fff;--surface:#f7f5f6;--ink:#2b0c11;--muted:#6b5a5d;--line:#e9e3e5;--red:#be1f35;--red-soft:#fbe9ec;--blue:#0a86e0;--green:#00a652;--purple:#703fd6;--on:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#140c0e;--surface:#1d1416;--ink:#f6eef0;--muted:#b9a7ab;--line:#3a2b2f;--red:#ee5a6f;--red-soft:#3a1820;--blue:#4aa8ef;--green:#34c584;--purple:#a284f2;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Montserrat","Helvetica Neue",Arial,sans-serif;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px)) 24px max(16px,env(safe-area-inset-right,0px))}
.card{width:100%;max-width:420px;background:var(--bg);border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:0 18px 40px -18px rgba(43,12,17,.25)}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:20px;letter-spacing:-.02em;margin-bottom:22px}
.logo i{display:grid;grid-template-columns:repeat(2,9px);gap:3px}.logo b{width:9px;height:9px;border-radius:2px;display:block}
.eyebrow{color:var(--red);font-weight:800;font-size:13px;letter-spacing:.02em}
h1{font-size:30px;line-height:1.05;font-weight:800;letter-spacing:-.03em;margin:8px 0 10px}
p{color:var(--muted);font-weight:500;margin:0 0 20px;font-size:14.5px;line-height:1.5}
label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}
input{width:100%;border:1px solid var(--line);border-radius:14px;padding:13px 14px;font:inherit;font-size:16px;background:var(--surface);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
button{margin-top:14px;width:100%;border:0;border-radius:14px;padding:14px;background:var(--red);color:var(--on);font:inherit;font-weight:800;font-size:14px;letter-spacing:.04em;text-transform:uppercase;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--red);font-weight:700;font-size:13px;min-height:18px;margin-top:10px}
.remember{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:13px;font-weight:600;color:var(--muted)}
.remember input{width:auto}
</style>
</head>
<body>
<form class="card" id="gate" autocomplete="off">
  <div class="logo"><i><b style="background:var(--red)"></b><b style="background:var(--blue)"></b><b style="background:var(--green)"></b><b style="background:var(--purple)"></b></i>Gustando</div>
  <div class="eyebrow">Piano di lancio · area riservata</div>
  <h1>Inserisci la password</h1>
  <p>La pagina è cifrata: si apre solo con la password della squadra Webnova × DCSWEB.</p>
  <label for="pw">Password</label>
  <input id="pw" type="password" autocomplete="current-password" required>
  <label class="remember"><input type="checkbox" id="rem"> Ricorda su questo dispositivo</label>
  <button type="submit" id="go">Entra</button>
  <div class="err" id="err" role="alert"></div>
</form>

  const page = html.replace('<head>', '<head><script>window.__GK=' + JSON.stringify(pw).replace(/</g, '\\u003c') + '<\/script>');
  document.open(); document.write(page); document.close();
}
const f = document.getElementById('gate'), err = document.getElementById('err'), go = document.getElementById('go');
f.addEventListener('submit', async e => {
  e.preventDefault(); err.textContent = ''; go.disabled = true; go.textContent = 'Apro…';

  catch (x) { err.textContent = 'Password errata.'; go.disabled = false; go.textContent = 'Entra'; document.getElementById('pw').select(); }

let saved = null; try { saved = sessionStorage.getItem('gustando-gk') || localStorage.getItem('gustando-gk'); } catch (e) {}
if (saved) open(saved, false).catch(() => { try { sessionStorage.removeItem('gustando-gk'); localStorage.removeItem('gustando-gk'); } catch (e) {} });
else document.getElementById('pw').focus();
